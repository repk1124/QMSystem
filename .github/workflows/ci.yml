name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qm
          POSTGRES_PASSWORD: qm_test_pw
          POSTGRES_DB: qm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qm -d qm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # 出勤工時等時間斷言假設 UTC
      TZ: UTC
      DATABASE_URL: postgresql://qm:qm_test_pw@localhost:5432/qm_test
      SESSION_SECRET: ci-only-session-secret-not-for-production
      UPLOAD_DIR: ${{ github.workspace }}/.ci-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Migrate + unit / API tests（空庫）
        run: npm test
      # e2e 會自己起 dist/index.js、自動 migrate 並用 INITIAL_ADMIN_PASSWORD 建管理員，
      # 所以要用一個乾淨的資料庫 —— 上一步的 npm test 已經在 qm_test 建了使用者，
      # 管理員不會再重建，密碼就對不上（CI 第一次跑就是這樣紅的）。
      - name: Create empty DB for e2e
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE qm_e2e"
      - name: End-to-end API tests（起正式 bundle 打全部路由）
        env:
          DATABASE_URL: postgresql://qm:qm_test_pw@localhost:5432/qm_e2e
          E2E_ADMIN_PASSWORD: E2eAdminPass123
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: quotationmaster:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
